# schedd 配置文件（INI 风格，启动时读一次，**无热重载**）
# 依据：详细设计 §4.3（配置文件设计）/ §4.3.4（解析约定）
#
# 取值约定：
#   - 任一键缺失或留空一律取默认值，**不阻塞启动**（D-23）；
#   - 整型键留空或写非法字面量 → 取默认值，不报错（§4.3.4）；
#   - 三个路径键留空 → 取编译期宏展开值（CPU_FREQ_PATH / NPU_FREQ_PATH / PROC_STAT_PATH）。

[server]
# UDS 监听路径（承载：serviceInterface::socketPath）
socket_path = /run/schedd.sock
# 最大并发连接数，同时作 listen 队列长度（承载：serviceInterface::maxConn）
max_conn    = 16

[agent]
# 模型文件名；目录固定为宏 MODEL_DIR，契约名由它派生成同名 .json
# 留空 = 推理停用（model 置空串），**不隐式回落到 default.onnx**
model_file  = dqn.onnx

[system]
# 四个档位收窄上下限（kHz；0 = 不限）
# 作用方式：装配期收窄设备档位表，不另设限制表；收窄后为空则保留原表
cpu_freq_min       = 0
cpu_freq_max       = 0
npu_freq_min       = 0
npu_freq_max       = 0

# 设备节点路径；留空取宏默认（测试可注入伪 sysfs）
cpu_freq_path      =
npu_freq_path      =
# CPU 统计文件路径；留空取 /proc/stat
proc_stat_path     =

# 采样间隔（毫秒）；非正值回退 500。监控线程每 poll 一次推进时间，实际刷新间隔即此值
sample_interval_ms = 500
