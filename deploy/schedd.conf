# schedd 配置文件（INI 风格）
# 默认安装位置：/etc/schedd/schedd.conf
# 见《软件详细设计文档》7.2

[server]
socket_path = /run/schedd.sock
max_conn = 16

[agent]
default_mode = auto
infer_timeout_us = 5000
model_path = /usr/lib/schedd/dqn_model.onnx
contract_path = /usr/lib/schedd/model_contract.json

[system]
# 留空表示启动时从硬件 devfreq 读取
cpu_freq_min =
cpu_freq_max =
npu_freq_min =
npu_freq_max =
sample_interval_ms = 500
