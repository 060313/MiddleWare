# schedd 配置文件（INI 风格）
# 详见《详细设计文档（新）》§10.3

[server]
# UDS 监听路径
socket_path = /run/schedd.sock
# 最大并发连接数
max_conn    = 16

[agent]
# 启动默认模型；取值经校验后写入，非法取值仅告警并保持现状
default_model    = dqn
# 推理超时（微秒）
infer_timeout_us = 5000
# 模型目录（路径第一段，随部署环境变化）
model_dir        = /usr/lib/schedd/models
# 模型文件名（路径第二段，随算法变化）
model_file       = dqn.onnx
# 契约目录（路径第一段）
contract_dir     = /usr/lib/schedd/models
# 契约文件名（路径第二段）
contract_file    = dqn.json

[system]
# 四个频率上下限（0 = 不限）；装配期用于收窄设备档位表
cpu_freq_min       = 0
cpu_freq_max       = 0
npu_freq_min       = 0
npu_freq_max       = 0
# 设备节点路径；留空表示使用编译期默认值
cpu_freq_path      =
npu_freq_path      =
# CPU 统计文件路径；留空表示使用 /proc/stat
proc_stat_path     =
# 采样间隔（毫秒）；非正值回退 500
sample_interval_ms = 500
